name: warehouse-stock

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-warehouse-stock}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-warehouse_root}
      MYSQL_DATABASE: ${DB_NAME:-warehouse_db}
      MYSQL_USER: ${DB_USER:-warehouse_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-warehouse_pwd}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-warehouse-stock}-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-warehouse_db}
      DB_USER: ${DB_USER:-warehouse_user}
      DB_PASSWORD: ${DB_PASSWORD:-warehouse_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRE_HOURS: "72"
      RATE_LIMIT_PER_MINUTE: "120"
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_MB: "10"
    ports:
      - "${BACKEND_PORT:-19205}:8080"
    volumes:
      - upload-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-warehouse-stock}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18705}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  upload-data:
